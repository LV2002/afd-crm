# Hourly: ad spend from Meta and Google, and the two retargeting audiences.
#
# The numbers somebody reads during the working day. Once a day means the
# ROAS figure is this morning's when it is looked at after lunch, and a
# lead who enquired at 9am is not in a retargeting audience until
# tomorrow — on the day they were actually deciding.
#
# Minute 25 rather than 0: the ten-minute workflow fires on the ten, and
# GitHub's own scheduler is busiest on the hour. Nothing breaks if they
# overlap, but there is no reason to arrange it.
name: CRM — hourly jobs

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/hourly
        env:
          BASE_URL: ${{ secrets.CRM_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::CRM_BASE_URL or CRON_SECRET is not set. See docs/CRON-SETUP.md."
            exit 1
          fi
          code=$(curl -sS --max-time 300 -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/hourly")
          echo "HTTP $code"
          cat /tmp/body; echo
          if [ "$code" = "401" ]; then
            echo "::error::Turned away (401). CRON_SECRET here does not match the deployment's."
            exit 1
          fi
          test "$code" = "200"
