# Clicking through the whole CRM, on GitHub's machines.
#
# The point of running it here rather than on somebody's laptop: it needs
# Postgres, a real Supabase auth server and a browser, and asking the person
# who owns the institute to install Docker to find out whether a button
# works is the wrong trade. Press "Run workflow" on the Actions tab, wait,
# download the report.
#
# `ci.yml` is the fast one that runs on every push — typecheck, lint, 1300
# unit tests, build. This is the slow one, run deliberately: it builds the
# app, signs in as all six roles and opens every screen each of them can
# reach, on a desktop and a phone viewport.
name: Browser test

on:
  # The button on the Actions tab.
  workflow_dispatch:
  # And automatically before anything reaches main, which is the moment it
  # is worth knowing that a screen stopped rendering.
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The local stack's fixed ports — see supabase/config.toml.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      E2E_BASE_URL: http://127.0.0.1:3000
      # This workflow starts the app itself, below. Without this Playwright
      # would also try, and the two would race for port 3000.
      E2E_NO_SERVER: "1"
      # Must decode from base64 to exactly 32 bytes. Test-only; the real
      # one lives in Vercel and is never in git.
      INTEGRATION_ENCRYPTION_KEY: WtfLZ63NJuR9qwPE+04o3rDNep5AApy0lslFiAg/0D0=
      CRON_SECRET: e2e-cron-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Brings up Postgres AND the auth server. The whole reason this
      # workflow exists: without a real auth server the suite cannot log
      # in, and a browser test that cannot log in tests the login page.
      - name: Start Supabase
        run: supabase start

      # The anon and service-role keys are generated by the local stack.
      # Read rather than hardcoded, so a CLI change that rotates them does
      # not leave this silently signing in with the wrong key.
      - name: Read the local keys
        run: |
          supabase status -o env | tee .supabase-status
          {
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' .supabase-status | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' .supabase-status | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npm run db:migrate

      # Creates the configuration AND the six logins the suite signs in as.
      # The logins only exist because the service-role key is set above —
      # without it the seed skips them and every test fails at the login
      # page.
      - name: Seed configuration and the six test logins
        run: npm run db:seed

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Against the production build rather than `next dev`. A dev server
      # compiles each route on first request, which makes the first visit
      # to every screen slow enough to look like a hang, and this suite
      # visits a lot of screens exactly once.
      - name: Start the app
        run: |
          npm start &
          # A plain loop rather than a wait-for-it package: one less
          # dependency fetched in CI, and the failure is readable.
          timeout 120 bash -c 'until curl -sfo /dev/null "$E2E_BASE_URL/login"; do sleep 2; done' \
            || { echo "The app never came up on $E2E_BASE_URL"; exit 1; }

      - name: Run the browser suite
        run: npm run e2e

      # The report is the deliverable. On a failure it carries a trace —
      # a replay of the clicks, the network and the page at each step —
      # which is the difference between "a test failed" and knowing why.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
