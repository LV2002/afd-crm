# Every check a contributor runs locally, run on every push and pull
# request — against a real Postgres with the real migrations and seed.
#
# That last part is the point. Twenty-three of this repo's test files need
# a live database: they are the ones that prove row-level security actually
# stops a Kannur counsellor reading Kochi's leads, that the audit log
# refuses a forged actor, and that the ledger will not accept an update.
# Until now they only ran when somebody remembered to run them (security
# audit 2026-09-15, test-coverage gap #2), which means the proof of the
# whole authorization model was optional.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The button on the Actions tab, and the API.
  #
  # Added after a push to a pull-request branch that GitHub never
  # associated with the pull request: no run was queued, the previous
  # run's `cancel-in-progress` never fired, and the pull request went on
  # showing a failure that the pushed commit had already fixed. With only
  # `pull_request` here there was no way to ask for a run — and the two
  # usual workarounds, an empty commit and a close-and-reopen, are both
  # things this project does not do.
  workflow_dispatch:

concurrency:
  # A second push to the same branch cancels the first — no point finishing
  # a run for code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afd_ci
      # Test-only values. The real ones live in Vercel and are never in git.
      # This one must decode from base64 to exactly 32 bytes — the
      # credential store checks, and a hex string of the right length is
      # the wrong length once decoded.
      INTEGRATION_ENCRYPTION_KEY: WtfLZ63NJuR9qwPE+04o3rDNep5AApy0lslFiAg/0D0=
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Supabase provides the `auth` schema and the anon/authenticated
      # roles in production. A bare Postgres has neither, and the RLS
      # policies reference both, so the shim stands in for them exactly as
      # it does on a developer's machine. It must never touch a real
      # Supabase project — see the file's own header.
      - name: Create the Supabase-shaped scaffolding
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/local-supabase-shim.sql

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed configuration
        run: npm run db:seed

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The whole suite, including every database-backed file. If this step
      # is ever made conditional or allowed to fail, the security model
      # stops being tested — say so in the pull request rather than doing
      # it quietly.
      - name: Test
        run: npm test

      # Supabase's own Security and Performance advisors, run here instead of
      # only in the dashboard — the difference between finding out when
      # somebody looks and finding out when somebody pushes. Fails on any
      # ERROR or WARN that is not deliberately exempted with a reason; see
      # src/lib/db/audit-cli.ts.
      - name: Database advisors
        run: npm run db:audit

      - name: Build
        run: npm run build
